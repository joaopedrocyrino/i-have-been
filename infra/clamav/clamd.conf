# This daemon is private to the application network. No host port is published.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
MaxThreads 4
MaxQueue 8
ReadTimeout 120
CommandReadTimeout 10
SendBufTimeout 120
StreamMaxLength 101M
MaxFileSize 100M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
# Avoid doubling database memory usage during signature updates.
ConcurrentDatabaseReload no
