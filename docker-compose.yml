services:
  otel-collector:
    profiles: [observability]
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./infra/otel/collector.local.yaml:/etc/otelcol/config.yaml:ro]
    networks: [private]
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    cpu_period: 100000
    cpu_quota: 50000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  clamav:
    image: clamav/clamav:1.5.4_base
    platform: linux/amd64
    environment:
      TZ: UTC
    volumes:
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav_signatures:/var/lib/clamav
    networks: [private, scanner_updates]
    mem_limit: 4g
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ihb}
      POSTGRES_DB: ${POSTGRES_DB:-ihb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  garage:
    image: dxflrs/garage:v2.4.1
    command: [/garage, server, --single-node]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Generate .env first}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Generate .env first}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks: [private]
    healthcheck:
      test: [CMD, /garage, status]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  garage-init:
    image: node:22-alpine
    command: [node, /scripts/garage-init.mjs]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Generate .env first}
      S3_BUCKET: ${S3_BUCKET:-i-have-been-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Generate .env first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Generate .env first}
    volumes: [./scripts/garage-init.mjs:/scripts/garage-init.mjs:ro]
    networks: [private]
    depends_on:
      garage: {condition: service_healthy}
  migrate:
    build: .
    image: ${APP_IMAGE:-i-have-been:dev}
    command: [--migrate]
    environment: &application
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-ihb};Username=${POSTGRES_USER:-ihb};Password=${POSTGRES_PASSWORD:?Generate .env first}
      Storage__Endpoint: http://garage:3900
      Storage__Bucket: ${S3_BUCKET:-i-have-been-media}
      Storage__AccessKey: ${S3_ACCESS_KEY_ID:?Generate .env first}
      Storage__SecretKey: ${S3_SECRET_ACCESS_KEY:?Generate .env first}
      DataProtection__Path: /var/lib/i-have-been/keys
      Security__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Security__TrustedProxies__0: ${TRUSTED_PROXY_IP:-127.0.0.1}
      Storage__UserPhotoMaxBytes: ${USER_PHOTO_MAX_BYTES:-20971520}
      Storage__UserVideoMaxBytes: ${USER_VIDEO_MAX_BYTES:-104857600}
      MalwareScanning__Enabled: ${MALWARE_SCANNING_ENABLED:-true}
      MalwareScanning__Host: clamav
      Telemetry__Enabled: ${TELEMETRY_ENABLED:-false}
      Telemetry__Endpoint: http://otel-collector:4318
      Telemetry__TraceSampleRatio: ${TELEMETRY_TRACE_SAMPLE_RATIO:-0.1}
      Telemetry__MetricIntervalMilliseconds: ${TELEMETRY_METRIC_INTERVAL_MS:-60000}
      Telemetry__ServiceVersion: ${RELEASE_SHA:-local}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1;app}
    volumes: [protection_keys:/var/lib/i-have-been/keys]
    networks: [private]
    depends_on:
      postgres: {condition: service_healthy}
  app:
    build: .
    image: ${APP_IMAGE:-i-have-been:dev}
    environment: *application
    ports: ["127.0.0.1:${APP_PORT:-4188}:8080"]
    volumes: [protection_keys:/var/lib/i-have-been/keys]
    networks:
      private:
        aliases: [ihb.test]
      edge:
    depends_on:
      migrate: {condition: service_completed_successfully}
      garage-init: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
    restart: unless-stopped
  production-check:
    profiles: [tools]
    image: ${APP_IMAGE:-i-have-been:dev}
    environment:
      <<: *application
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: production-check
    volumes: [protection_keys:/var/lib/i-have-been/keys]
    networks: [private]
    depends_on:
      migrate: {condition: service_completed_successfully}
      garage-init: {condition: service_completed_successfully}
  check:
    profiles: [tools]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /work
    command: [sh, -c, 'dotnet restore IHaveBeen.slnx --locked-mode && dotnet build IHaveBeen.slnx --no-restore -c Release && dotnet test --solution IHaveBeen.slnx --no-build --no-restore -c Release']
    volumes: [.:/work, nuget_cache:/root/.nuget/packages]
    networks: [edge]
  upload-timeout-check:
    profiles: [tools]
    image: ${APP_IMAGE:-i-have-been:dev}
    environment:
      <<: *application
      RequestLimits__UploadTimeoutSeconds: 1
      AllowedHosts: upload-timeout-check
    volumes: [protection_keys:/var/lib/i-have-been/keys]
    networks: [private]
    depends_on:
      migrate: {condition: service_completed_successfully}
      garage-init: {condition: service_completed_successfully}
  smoke:
    profiles: [tools]
    image: node:22-alpine
    working_dir: /work
    command: [node, scripts/smoke.mjs]
    environment:
      BASE_URL: http://app:8080
      GARAGE_URL: http://garage:3900
      PRODUCTION_URL: http://production-check:8080
      UPLOAD_TIMEOUT_URL: http://upload-timeout-check:8080
    volumes: [.:/work:ro]
    networks: [private]
    depends_on:
      app: {condition: service_started}
      production-check: {condition: service_started}
      upload-timeout-check: {condition: service_started}
  browser:
    profiles: [tools]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    shm_size: 1gb
    working_dir: /work
    command: [node, scripts/browser-smoke.mjs]
    environment:
      BASE_URL: http://ihb.test:8080
    volumes: [.:/work]
    networks: [private, edge]
    depends_on:
      app: {condition: service_started}
  auth-browser:
    profiles: [tools]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    shm_size: 1gb
    working_dir: /work
    command: [node, scripts/auth-browser.mjs]
    environment:
      BASE_URL: http://ihb.test:8080
      AUTH_TEST_PROJECT: ${AUTH_TEST_PROJECT:-}
    volumes: [.:/work]
    networks: [private, edge]
    depends_on:
      app: {condition: service_started}
  offline-browser:
    profiles: [tools]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    shm_size: 1gb
    working_dir: /work
    command: [node, scripts/offline-browser.mjs]
    environment:
      BASE_URL: http://localhost:8080
      OFFLINE_TEST_PROJECT: ${OFFLINE_TEST_PROJECT:-}
    volumes: [.:/work]
    network_mode: container:${OFFLINE_TEST_PROJECT:-no-offline-test-project}-app-1
    depends_on:
      app: {condition: service_started}
networks:
  private:
    internal: true
  edge:
  scanner_updates:
volumes:
  postgres_data:
  garage_meta:
  garage_data:
  protection_keys:
  nuget_cache:
  clamav_signatures:
